name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# AI-agent cases (tests/ai) are run by hand with a sub-agent, never in CI;
# timing assertions run only via `npm run test:perf`. See CONVENTIONS.md.
#
# Every job starts at once; none waits on another. The run takes as long
# as its slowest job, not the sum of a chain. The static checks run once,
# on Linux, since their results do not depend on the platform; the unit
# tests run on macOS and Windows, split in two on each so the slowest
# part of the run is halved.

# A new push to a pull request supersedes the run in flight for it.
# Pushes to main are left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # The version lives in four files that must agree; drift is silent
      # and only bites mid-release. (Skill-bundle staleness is caught by
      # skill-bundle.test.ts, which compares contents rather than bytes —
      # zip metadata isn't stable enough to diff.)
      - run: npm run version:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit (${{ matrix.os }}, ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/2

  rust:
    name: Rust shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Both platforms on purpose. The shell has genuinely
      # platform-divergent code (RunEvent::Opened is macOS-only), and a
      # Windows-only build break has slipped through before precisely
      # because nothing in CI compiled the Rust.
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # No Node here on purpose: `cargo check` doesn't need ../dist to
      # exist (only a full `tauri build` would), and setting up npm on two
      # runners to produce a frontend nothing reads costs minutes per run.
      - name: Format
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Compile
        run: cargo check --all-targets
        working-directory: src-tauri
      # -D warnings is deliberate but does mean a new rustc/clippy release
      # can fail CI on code that hasn't changed. If that gets annoying,
      # drop the flag rather than the job — the compile check above is the
      # part that catches real breakage.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  e2e:
    name: E2E (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      # No Rust here: this job drives the Vite surface in Chromium.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Tauri E2E will replace this Vite-only smoke once tauri-driver lands.
      - name: Start Vite and run Playwright
        run: |
          npm run vite:dev &
          VITE_PID=$!
          npx wait-on http://localhost:1420 -t 30000
          npm run test:e2e
          kill $VITE_PID || true

  # The bundle itself, on the platform the release script targets. cargo
  # check catches compile errors; a broken icon set, entitlements file, or
  # bundle config only shows up here — and used to show up on release day.
  # Main pushes only, so pull requests stay quick. It runs alongside the
  # tests rather than after them: a failure anywhere still fails the run.
  macos-build:
    name: macOS app build
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri -- build --bundles app
