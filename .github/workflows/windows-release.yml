name: Windows release

# Builds the unsigned Windows installer (-setup.exe, via NSIS) on a
# windows-latest runner and attaches it, with its updater signature, to
# the matching GitHub
# draft release (created by `npm run release:start`). macos-release.yml,
# linux-release.yml and cli-release.yml fill in the rest.
#
# Triggers:
#   - automatically on any `v*` tag push (builds that tag);
#   - manually via "Run workflow", passing an existing release tag (used to
#     backfill a release that was tagged before this workflow existed, and
#     published before releases became immutable).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the installers to (e.g. v1.3.0)"
        required: true
        type: string
      ref:
        description: "Git ref to build (default: the tag itself). Set to 'main' to backfill a release whose tagged code predates a Windows build fix."
        required: false
        default: ""
        type: string

# Required for `gh release upload` with the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Tag push → the pushed tag. Manual dispatch → the `ref` input if
          # given (e.g. main), else the tag input.
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # `tauri build` runs `npm run vite:build` (beforeBuildCommand) first,
      # then bundles the NSIS -setup.exe, the one Windows installer a
      # release carries (an .msi did the same job). It carries no
      # Authenticode signature (no Windows code-signing certificate is set).
      # tauri.release.conf.json turns on the update artifacts: a `.sig`
      # beside the installer, made with the updater key, which the app
      # checks every update against; `npm run release:publish` reads it
      # into latest.json and takes it off the release. The secrets are the
      # key and its password (docs/releasing.md, "Updater signing key").
      - name: Build Windows bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        # Adds to the draft release; never creates one or replaces an
        # asset. See scripts/release-attach.sh.
        run: |
          bash scripts/release-attach.sh "$TAG" \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
