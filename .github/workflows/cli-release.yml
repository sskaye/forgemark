name: CLI release

# Attaches the forgemark command-line tool to the matching GitHub release,
# so it can be installed at a pinned version without the app or the
# skill: the committed bundle, renamed for its version
# (`forgemark-cli-<ver>.mjs`). The bundle needs only Node 18, and carries
# Forgemark's licence at its start and the notices of the packages it
# bundles at its end. GitHub shows its SHA-256 on the release.
#
# Triggers:
#   - automatically on any `v*` tag push (attaches that tag's bundle);
#   - manually via "Run workflow", passing an existing release tag.
#
# Like the other release workflows, it adds to the draft release that
# `npm run release:start` created, and never creates one (see
# scripts/release-attach.sh).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the CLI to (e.g. v1.10.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach:
    name: Attach the CLI
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The oldest Node the bundle promises to run on.
      - uses: actions/setup-node@v5
        with:
          node-version: "18"

      - name: Check the bundle runs and is this version
        run: |
          set -euo pipefail
          printed="$(node assets/forgemark-skill/scripts/forgemark.mjs --version)"
          if [ "v${printed}" != "$TAG" ]; then
            echo "::error::The committed bundle reports ${printed}, but the tag is ${TAG}. Run npm run build:skill and commit."
            exit 1
          fi

      - name: Collect the CLI
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p out
          cp assets/forgemark-skill/scripts/forgemark.mjs "out/forgemark-cli-${version}.mjs"
          sha256sum out/*.mjs

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-attach.sh "$TAG" out/*
