name: Feature request
description: Something Forgemark should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task, and what gets in the way today. A real example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work, if you have an idea.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - The app
        - The command-line tool (forgemark)
        - The agent skill
        - The file format
